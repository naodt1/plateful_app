name: plateful
description: A recipe saving and meal planning app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.0.0
  go_router: ^13.0.0
  flutter_riverpod: ^2.5.0
  google_fonts: ^6.2.0
  cached_network_image: ^3.3.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  url_launcher: ^6.2.0
  receive_sharing_intent: ^1.8.0
  http: ^1.2.0
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0
  uuid: ^4.3.0
  shared_preferences: ^2.2.0
  purchases_flutter: ^10.2.0
  purchases_ui_flutter: ^10.2.0
  webview_flutter: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
