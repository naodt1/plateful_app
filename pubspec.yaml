name: plateful
description: A recipe saving and meal planning app.
publish_to: 'none'
version: 1.1.0+19

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Firebase (Auth + Firestore). AI edge functions still call Supabase over
  # HTTP from claude_service, which needs no Dart Supabase package.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  facebook_app_events: ^0.28.0
  cloud_firestore: ^5.4.4
  go_router: ^13.0.0
  flutter_riverpod: ^2.5.0
  google_fonts: ^6.2.0
  cached_network_image: ^3.3.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  url_launcher: ^6.2.0
  receive_sharing_intent: ^1.8.0
  http: ^1.2.0
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0
  uuid: ^4.3.0
  shared_preferences: ^2.2.0
  purchases_flutter: ^10.4.1
  purchases_ui_flutter: ^10.4.1
  webview_flutter: ^4.13.1
  google_sign_in: ^7.2.0
  confetti: ^0.8.0
  wakelock_plus: ^1.2.8
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/tutorial_Steps/
